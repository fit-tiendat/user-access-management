name: CI/CD

on:
  push:
    branches: [ "main", "datnt" ]
  pull_request:
    branches: [ "main" ]

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  # =========================================
  # 1) BUILD – chỉ build JAR, không chạy test
  # =========================================
  build:
    name: Build (mvn package -DskipTests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven package (skip tests)
        run: mvn -B -DskipTests clean package

  # =========================================
  # 2) TEST – dùng Postgres service + chạy test (skip E2E)
  # =========================================
  test:
    name: Test (skip E2E, generate HTML report)
    runs-on: ubuntu-latest
    needs: build

    # ENV cho job test
    env:
      SPRING_PROFILES_ACTIVE: docker

      # tên DB lấy từ repo variables
      AUTH_DB: ${{ vars.AUTH_DB }}
      USER_DB: ${{ vars.USER_DB }}

      # credentials dùng cho Spring
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

      SPRING_DATASOURCE_URL_AUTH: jdbc:postgresql://postgres-db:5432/${{ vars.AUTH_DB }}
      SPRING_DATASOURCE_URL_USER: jdbc:postgresql://postgres-db:5432/${{ vars.USER_DB }}

      # JWT
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXP_MINUTES: 120

    services:
      postgres-db:
        image: postgres:15
        env:
          # ⚠️ Ở đây KHÔNG dùng expression nữa
          # Dùng đúng user/password giống docker-compose & local .env
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: d433221dat
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Postgres client & create databases
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          echo "Waiting for Postgres..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U "${DB_USER}"; then
              echo "Postgres is up!"
              break
            fi
            sleep 2
          done

          echo "Create ${AUTH_DB} DB if not exists"
          psql -h localhost -p 5432 -U "${DB_USER}" -tc "SELECT 1 FROM pg_database WHERE datname='${AUTH_DB}';" | grep -q 1 || \
            psql -h localhost -p 5432 -U "${DB_USER}" -c "CREATE DATABASE ${AUTH_DB};"

          echo "Create ${USER_DB} DB if not exists"
          psql -h localhost -p 5432 -U "${USER_DB}" -tc "SELECT 1 FROM pg_database WHERE datname='${USER_DB}';" | grep -q 1 || \
            psql -h localhost -p 5432 -U "${DB_USER}" -c "CREATE DATABASE ${USER_DB};"
        env:
          DB_USER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Run Maven tests + HTML report (skip E2E)
        run: |
          mvn -B clean test surefire-report:report \
            -DfailIfNoTests=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest='*Test,!AuthE2EFlowTest,!E2EFlowTest'

      - name: Upload test reports (JUnit XML + HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/site

  # =========================================
  # 3) DEPLOY – chạy docker compose trên máy em (self-hosted)
  #    Sau bước này Postman gọi localhost:8081 / 8082
  # =========================================
  deploy:
    name: Deploy to local Docker (for Postman)
    needs: test
    if: github.ref == 'refs/heads/datnt'
    runs-on: self-hosted

    env:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_DB: ${{ vars.AUTH_DB }}
      USER_DB: ${{ vars.USER_DB }}
      PG_PORT_HOST: ${{ vars.PG_PORT_HOST }}   # = 55432 theo repo variables

      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXP_MINUTES: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Debug env
        run: |
          echo "PG_PORT_HOST=${PG_PORT_HOST}"
          echo "AUTH_DB=${AUTH_DB}"
          echo "USER_DB=${USER_DB}"

      - name: Start stack with Docker Compose
        run: |
          docker compose pull
          docker compose up -d --build

      - name: Show running containers
        run: docker ps
