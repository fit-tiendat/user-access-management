name: CI/CD

on:
  push:
    branches: [ main, datnt ]
  pull_request:
    branches: [ main ]

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres-db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: d433221dat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: d433221dat
      AUTH_DB: auth_service
      USER_DB: user_service
      SPRING_DATASOURCE_URL_AUTH: jdbc:postgresql://postgres-db:5432/auth_service
      SPRING_DATASOURCE_URL_USER: jdbc:postgresql://postgres-db:5432/user_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: d433221dat
      JWT_SECRET: w5h2Yk1Gd3dtdkFzT0h0bTFwM05XUnJvV0V1NHVZbU5yZFRyWW9oUUNmQ1hLcw==
      JWT_EXP_MINUTES: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Cài psql client & tạo DB auth_service + user_service
      - name: Install Postgres client & create databases
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          echo "Waiting for Postgres..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is up!"
              break
            fi
            sleep 2
          done

          echo "Create auth_service DB if not exists"
          psql -h localhost -p 5432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='auth_service';" | grep -q 1 || \
            psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE auth_service;"

          echo "Create user_service DB if not exists"
          psql -h localhost -p 5432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='user_service';" | grep -q 1 || \
            psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE user_service;"
        env:
          PGPASSWORD: d433221dat

      # Chạy toàn bộ test, bỏ qua các E2E cần Docker-in-Docker
      - name: Run Maven tests + HTML report (skip E2E)
        run: |
          mvn -B clean test surefire-report:report \
            -DfailIfNoTests=false \
            -Dsurefire.failIfNoSpecifiedTests=false
#            -Dtest='*Test,!AuthE2EFlowTest,!E2EFlowTest'

      # Upload JUnit XML + HTML (Surefire report)
      - name: Upload test reports (JUnit XML + HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/site

  package:
    name: Build JARs (skip tests)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven package (skip tests)
        run: mvn -B -DskipTests package

  docker:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build auth-service image
        run: |
          docker build -t ghcr.io/${{ env.OWNER }}/user-access-management-auth-service:${{ github.sha }} \
            -f auth-service/Dockerfile .

      - name: Build user-service image
        run: |
          docker build -t ghcr.io/${{ env.OWNER }}/user-access-management-user-service:${{ github.sha }} \
            -f user-service/Dockerfile .

      - name: Push images
        run: |
          docker push ghcr.io/${{ env.OWNER }}/user-access-management-auth-service:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER }}/user-access-management-user-service:${{ github.sha }}
