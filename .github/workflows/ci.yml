name: CI/CD

on:
  push:
    branches: [ main, datnt ]
  pull_request:
    branches: [ main ]

jobs:
  # 1) Chạy test + tạo HTML report
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests with HTML report
        run: mvn -B clean test surefire-report:report

      - name: Upload test reports (JUnit XML + HTML)
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            auth-service/target/surefire-reports
            user-service/target/surefire-reports
            auth-service/target/site
            user-service/target/site

  # 2) Build jar sau khi test pass
  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jars (skip tests)
        run: mvn -B -DskipTests package

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            auth-service/target/*.jar
            user-service/target/*.jar

  # 3) Build & push Docker image lên GitHub Container Registry (chỉ chạy trên main)
  docker:
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker images
        run: |
          # Tên repo Docker: ghcr.io/<owner>/<repo>-auth-service
          OWNER=${{ github.repository_owner }}

          docker build -t ghcr.io/$OWNER/user-access-management-auth-service:latest -f auth-service/Dockerfile .
          docker push ghcr.io/$OWNER/user-access-management-auth-service:latest

          docker build -t ghcr.io/$OWNER/user-access-management-user-service:latest -f user-service/Dockerfile .
          docker push ghcr.io/$OWNER/user-access-management-user-service:latest
