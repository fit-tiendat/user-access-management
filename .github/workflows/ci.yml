name: CI/CD

on:
  push:
    branches: [ main, datnt ]
  pull_request:
    branches: [ main ]

env:
  OWNER: ${{ github.repository_owner }}

  # ==== ENV dùng chung cho test ====
  SPRING_PROFILES_ACTIVE: docker
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: d433221dat
  AUTH_DB: auth_service
  USER_DB: user_service
  SPRING_DATASOURCE_URL_AUTH: jdbc:postgresql://postgres-db:5432/auth_service
  SPRING_DATASOURCE_URL_USER: jdbc:postgresql://postgres-db:5432/user_service
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: d433221dat
  JWT_SECRET: w5h2Yk1Gd3dtdkFzT0h0bTFwM05XUnJvV0V1NHVZbU5yZFRyWW9oUUNmQ1hLcw==
  JWT_EXP_MINUTES: 120

# ============================================================
# 1) BUILD  – chỉ build JAR, không chạy test
# ============================================================
jobs:
  build:
    name: Build (mvn package -DskipTests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven package (skip tests)
        run: mvn -B -DskipTests clean package

  # ============================================================
  # 2) TEST  – dùng Postgres service + chạy test, bỏ qua E2E
  # ============================================================
  test:
    name: Test (skip E2E, generate HTML report)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres-db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: d433221dat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Postgres client & create databases
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          echo "Waiting for Postgres..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is up!"
              break
            fi
            sleep 2
          done

          echo "Create auth_service DB if not exists"
          psql -h localhost -p 5432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='auth_service';" | grep -q 1 || \
            psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE auth_service;"

          echo "Create user_service DB if not exists"
          psql -h localhost -p 5432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='user_service';" | grep -q 1 || \
            psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE user_service;"
        env:
          PGPASSWORD: d433221dat

      - name: Run Maven tests + HTML report (skip E2E)
        run: |
          mvn -B clean test surefire-report:report \
            -DfailIfNoTests=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest='*Test,!AuthE2EFlowTest,!E2EFlowTest'

      - name: Upload test reports (JUnit XML + HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/site

  # ============================================================
  # 3) DEPLOY – chạy docker compose trên máy em (self-hosted runner)
  #    Sau bước này Postman có thể gọi localhost:8081 / 8082
  # ============================================================
  deploy:
    name: Deploy to local Docker (for Postman)
    needs: test
    # chỉ deploy khi push lên nhánh datnt (hoặc đổi thành main nếu muốn)
    if: github.ref == 'refs/heads/datnt'
    # phải dùng self-hosted runner thì container mới nằm trên máy em
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Giả sử em đã có sẵn file .env trong repo, docker-compose sẽ dùng các biến đó
      - name: Start stack with Docker Compose
        run: |
          docker compose pull
          docker compose up -d --build

      - name: Show running containers
        run: docker ps
