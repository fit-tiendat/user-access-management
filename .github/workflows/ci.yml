name: CI/CD

on:
  push:
    branches: [ main, datnt ]
  pull_request:
    branches: [ main ]

jobs:
  # 1) Chạy test + tạo HTML report
  test:
    runs-on: ubuntu-latest
    env:
      # --- các biến cho docker-compose & Spring ---
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: d433221dat
      PG_PORT_HOST: 5432

      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL_AUTH: jdbc:postgresql://postgres-db:5432/user_access_management
      SPRING_DATASOURCE_URL_USER: jdbc:postgresql://postgres-db:5432/user_access_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: d433221dat

      JWT_SECRET: w5h2Yk1Gd3dtdkFzT0h0bTFwM05XUnJvV0V1NHVZbU5yZFRyWW9oUUNmQ1hLcw==
      JWT_EXP_MINUTES: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests with HTML report
        run: mvn -B clean test surefire-report:report

      - name: Upload test reports (JUnit XML + HTML)
        if: always()   # luôn upload report dù test pass hay fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            auth-service/target/surefire-reports
            user-service/target/surefire-reports
            auth-service/target/site
            user-service/target/site
  

  # 2) Build jar sau khi test pass
  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jars (skip tests)
        run: mvn -B -DskipTests package

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            auth-service/target/*.jar
            user-service/target/*.jar

  # 3) Build & push Docker image lên GitHub Container Registry (chỉ chạy trên main)
  docker:
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker images
        run: |
          # Tên repo Docker: ghcr.io/<owner>/<repo>-auth-service
          OWNER=${{ github.repository_owner }}

          docker build -t ghcr.io/$OWNER/user-access-management-auth-service:latest -f auth-service/Dockerfile .
          docker push ghcr.io/$OWNER/user-access-management-auth-service:latest

          docker build -t ghcr.io/$OWNER/user-access-management-user-service:latest -f user-service/Dockerfile .
          docker push ghcr.io/$OWNER/user-access-management-user-service:latest
