name: CI/CD

on:
  push:
    branches: [ main, datnt ]
  pull_request:
    branches: [ main ]

env:
  OWNER: ${{ github.repository_owner }}

  # env không nhạy cảm
  SPRING_PROFILES_ACTIVE: docker
  AUTH_DB: auth_service
  USER_DB: user_service
  SPRING_DATASOURCE_URL_AUTH: jdbc:postgresql://postgres-db:5432/auth_service
  SPRING_DATASOURCE_URL_USER: jdbc:postgresql://postgres-db:5432/user_service
  JWT_EXP_MINUTES: 120

jobs:
  # ====================== 1) BUILD ======================
  build:
    name: Build (mvn package -DskipTests)
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.DB_USER }}
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven package (skip tests)
        run: mvn -B -DskipTests clean package

  # ====================== 2) TEST ======================
  test:
    name: Test (skip E2E, generate HTML report)
    runs-on: ubuntu-latest
    needs: build
    env:
      POSTGRES_USER: ${{ secrets.DB_USER }}
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    services:
      postgres-db:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ secrets.DB_USER }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Postgres client & create databases
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          echo "Waiting for Postgres..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U "$POSTGRES_USER"; then
              echo "Postgres is up!"
              break
            fi
            sleep 2
          done

          echo "Create auth_service DB if not exists"
          psql -h localhost -p 5432 -U "$POSTGRES_USER" -tc "SELECT 1 FROM pg_database WHERE datname='auth_service';" | grep -q 1 || \
            psql -h localhost -p 5432 -U "$POSTGRES_USER" -c "CREATE DATABASE auth_service;"

          echo "Create user_service DB if not exists"
          psql -h localhost -p 5432 -U "$POSTGRES_USER" -tc "SELECT 1 FROM pg_database WHERE datname='user_service';" | grep -q 1 || \
            psql -h localhost -p 5432 -U "$POSTGRES_USER" -c "CREATE DATABASE user_service;"
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Run Maven tests + HTML report (skip E2E)
        run: |
          mvn -B clean test surefire-report:report \
            -DfailIfNoTests=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest='*Test,!AuthE2EFlowTest,!E2EFlowTest'

      - name: Upload test reports (JUnit XML + HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/site

  # ====================== 3) DEPLOY ======================
  deploy:
    name: Deploy to local Docker (for Postman)
    needs: test
    if: github.ref == 'refs/heads/datnt'
    runs-on: self-hosted
    env:
      POSTGRES_USER: ${{ secrets.DB_USER }}
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Start stack with Docker Compose
        run: |
          docker compose pull
          docker compose up -d --build

      - name: Show running containers
        run: docker ps
