server.port=8082
spring.application.name=user-service
api.base-path=/api/v1

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=user-service-pool
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# JPA/Hibernate - disable DDL auto (use Flyway instead)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway - Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Security
security.jwt.secret=${JWT_SECRET}
security.jwt.previous-secret=${JWT_PREVIOUS_SECRET:}
security.jwt.expiration-minutes=${JWT_EXP_MINUTES}

# Comma-separated trusted browser origins; empty denies all cross-origin requests.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Bounded local cache for profile reads. Writes evict the affected username.
spring.cache.cache-names=profiles-by-username
spring.cache.caffeine.spec=maximumSize=${PROFILE_CACHE_MAX_SIZE:10000},expireAfterWrite=${PROFILE_CACHE_TTL:5m}

# Actuator - Monitoring endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.export.prometheus.enabled=true

