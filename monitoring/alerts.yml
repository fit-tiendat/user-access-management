groups:
  - name: user-access-management
    rules:
      - alert: UamServiceDown
        expr: up{job=~"uam-.+-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unavailable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for one minute."

      - alert: UamHighServerErrorRate
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_count{job=~"uam-.+-service",status=~"5.."}[5m]))
            /
            clamp_min(sum by (job) (rate(http_server_requests_seconds_count{job=~"uam-.+-service"}[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has a high HTTP 5xx rate"
          description: "More than 5% of requests have returned 5xx responses for five minutes."

      - alert: UamHighRequestLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, le) (
              rate(http_server_requests_seconds_bucket{job=~"uam-.+-service"}[5m])
            )
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} p95 latency is above one second"
          description: "The 95th percentile server request latency has exceeded one second for ten minutes."

      - alert: UamJvmHeapPressure
        expr: |
          (
            sum by (job) (jvm_memory_used_bytes{job=~"uam-.+-service",area="heap"})
            /
            sum by (job) (jvm_memory_max_bytes{job=~"uam-.+-service",area="heap"})
          ) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} heap usage is above 85%"
          description: "JVM heap pressure has remained high for ten minutes."
