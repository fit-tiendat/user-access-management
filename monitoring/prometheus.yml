global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: uam-auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:9081

  - job_name: uam-user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - user-service:9082
