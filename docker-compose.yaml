services:
  postgres-db:
    image: postgres:13 # Flyway Community 11.7.2 fully supports PG 13
    cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-512m}"
    pids_limit: 200
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Default database - Flyway will create auth_service and user_service
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${PG_PORT_HOST}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-create databases on first startup
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    cpus: "${AUTH_CPU_LIMIT:-0.75}"
    mem_limit: "${AUTH_MEMORY_LIMIT:-512m}"
    pids_limit: 200
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_AUTH}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP_MINUTES: "${JWT_EXP_MINUTES}"
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8081:8081"
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    cpus: "${USER_CPU_LIMIT:-0.75}"
    mem_limit: "${USER_MEMORY_LIMIT:-512m}"
    pids_limit: 200
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_USER}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP_MINUTES: "${JWT_EXP_MINUTES}"
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8082:8082"
volumes:
  postgres_data:
